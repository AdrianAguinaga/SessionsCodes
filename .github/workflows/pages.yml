# Publishes only labs/ to GitHub Pages: https://adrianaguinaga.github.io/SessionsCodes/<course>/<lab>/
name: Deploy labs to Pages
on:
  push:
    branches: [master]
    paths: ["labs/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: labs
      - id: deployment
        uses: actions/deploy-pages@v4
